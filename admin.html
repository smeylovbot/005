<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmeyLovbot</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f4f6f9; padding-top: 50px; }
        .admin-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; max-width: 600px; margin: auto; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ផ្ទាំង Login សម្ងាត់សម្រាប់ Admin -->
        <div id="loginSection" class="admin-card text-center">
            <h3 class="text-primary fw-bold mb-3"><i class="fa-solid fa-lock"></i> Admin Login</h3>
            <p class="text-muted small">សូមបញ្ចូលពាក្យសម្ងាត់ដើម្បីគ្រប់គ្រងសេវាកម្ម SmeyLovbot៖</p>
            <div class="mb-3">
                <input type="password" id="adminPass" class="form-control text-center" placeholder="Password...">
            </div>
            <button class="btn btn-primary w-100 fw-bold py-2" onclick="loginAdmin()">ចូលគ្រប់គ្រង</button>
            <a href="index.html" class="d-block mt-3 small text-decoration-none">← ត្រឡប់ទៅទំព័រដើមវិញ</a>
        </div>

        <!-- ផ្ទាំងគ្រប់គ្រងសេវាកម្ម (លាក់ទុករហូតដល់ឡុកអ៊ីនត្រូវ) -->
        <div id="dashboardSection" class="admin-card" style="display: none;">
            <div class="d-flex justify-content-between align-items: center mb-4">
                <h4 class="text-success fw-bold mb-0"><i class="fa-solid fa-gears"></i> គ្រប់គ្រងសេវាកម្ម SMM</h4>
                <button class="btn btn-sm btn-outline-danger" onclick="logoutAdmin()">ចាកចេញ</button>
            </div>

            <form id="addServiceForm" class="mb-4">
                <div class="mb-2">
                    <label class="form-label small fw-bold">ឈ្មោះ Category (ឧ. Facebook - Followers):</label>
                    <input type="text" id="admCategory" class="form-control" required placeholder="Facebook - Followers">
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-bold">ឈ្មោះសេវាកម្ម (Service Name):</label>
                    <input type="text" id="admName" class="form-control" required placeholder="Page Followers - Real">
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-bold">តម្លៃក្នុង ១០០០ ($ per 1k):</label>
                    <input type="number" step="0.0001" id="admRate" class="form-control" required placeholder="0.2139">
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label small fw-bold">Min:</label>
                        <input type="number" id="admMin" class="form-control" value="10">
                    </div>
                    <div class="col">
                        <label class="form-label small fw-bold">Max:</label>
                        <input type="number" id="admMax" class="form-control" value="1000000">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-plus"></i> បន្ថែមសេវាកម្មចូលវេបសាយ</button>
            </form>

            <h6 class="fw-bold text-secondary">បញ្ជីសេវាកម្មដែលមានស្រាប់៖</h6>
            <div id="adminServiceList" class="list-group small mb-3" style="max-height: 250px; overflow-y: auto;"></div>
            <button class="btn btn-outline-danger btn-sm w-100" onclick="clearServices()">លុបសេវាកម្មទាំងអស់</button>
            <a href="index.html" class="d-block mt-3 text-center small text-decoration-none">មើលទំព័រវេបសាយភ្ញៀវ →</a>
        </div>
    </div>

    <script>
        // 🔑 កំណត់លេខសម្ងាត់ Admin របស់អ្នកនៅទីនេះ
        const ADMIN_PASSWORD = "admin123";

        function loginAdmin() {
            let pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_PASSWORD) {
                localStorage.setItem('admin_logged', 'true');
                showDashboard();
            } else {
                alert('លេខសម្ងាត់មិនត្រូវគ្នាទេ!');
            }
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            renderServices();
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_logged');
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        let servicesData = JSON.parse(localStorage.getItem('smey_services')) || [];

        document.getElementById('addServiceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let newService = {
                id: servicesData.length > 0 ? servicesData[servicesData.length - 1].id + 1 : 1,
                category: document.getElementById('admCategory').value,
                name: document.getElementById('admName').value,
                rate: parseFloat(document.getElementById('admRate').value),
                min: parseInt(document.getElementById('admMin').value),
                max: parseInt(document.getElementById('admMax').value)
            };

            servicesData.push(newService);
            localStorage.setItem('smey_services', JSON.stringify(servicesData));
            alert('បានបន្ថែមសេវាកម្មជោគជ័យ!');
            document.getElementById('addServiceForm').reset();
            renderServices();
        });

        function renderServices() {
            let list = document.getElementById('adminServiceList');
            list.innerHTML = '';
            if(servicesData.length === 0) {
                list.innerHTML = '<div class="text-center text-muted py-2">មិនទាន់មានសេវាកម្មទេ</div>';
                return;
            }
            servicesData.forEach((s, index) => {
                list.innerHTML += `<div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>[${s.id}] ${s.name} ($${s.rate})</span>
                    <button class="btn btn-sm btn-danger py-0" onclick="deleteService(${index})"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
        }

        function deleteService(index) {
            servicesData.splice(index, 1);
            localStorage.setItem('smey_services', JSON.stringify(servicesData));
            renderServices();
        }

        function clearServices() {
            if(confirm('តើអ្នកពិតជាចង់លុបសេវាកម្មទាំងអស់មែនទេ?')) {
                servicesData = [];
                localStorage.removeItem('smey_services');
                renderServices();
            }
        }

        if(localStorage.getItem('admin_logged') === 'true') {
            showDashboard();
        }
    </script>
</body>
</html>
